# Bluefish — lightweight web editor
app_name: bluefish
binary: bluefish
atspi_name: bluefish
args:
  - ${DESKFORGE_ROOT}/assets/audit/sample_page.html
window_titles:
  - landing_page.html - Bluefish
  - Bluefish

interactions:
  - name: default
    description: Open Bluefish with a deterministic HTML file
    actions:
      - type: wait
        value: "2.0"

  - name: audit_probe
    description: Qualification probe with the File menu opened
    actions:
      - type: wait
        value: "1.0"
      - type: key
        value: "alt+f"
        delay: 1.0

  - name: find_dialog
    description: Open the search dialog
    actions:
      - type: key
        value: "ctrl+f"
        delay: 1.0
