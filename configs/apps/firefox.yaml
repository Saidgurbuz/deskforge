# Firefox browser
app_name: firefox
binary: firefox-bin
atspi_name: firefox
window_titles: ["Mozilla Firefox"]
args: ["--no-remote", "--profile", "/tmp/session_firefox_profile", "--new-window", "about:blank"]
env:
  MOZ_ENABLE_WAYLAND: "0"
  MOZ_DBUS_REMOTE: "1"
  MOZ_ALLOW_DOWNGRADE: "1"
  MOZ_ACCESSIBILITY_FORCE_DISABLED: "0"
  GNOME_ACCESSIBILITY: "1"
  ACCESSIBILITY_ENABLED: "1"
  MOZILLA_FIVE_HOME: "${DESKFORGE_ROOT}/tools/extracted/usr/lib64/firefox"

interactions:
  - name: default
    description: Open blank browser window
    actions:
      - type: wait
        value: "2.0"

  - name: new_tab
    description: Open additional tab
    actions:
      - type: key
        value: "ctrl+t"
        delay: 1.0

  - name: multiwindow_calculator_front
    description: Firefox with calculator companion launched on top (partial occlusion)
    companion_apps: ["gnome-calculator"]
    actions:
      - type: wait
        value: "1.0"
